[package]
name = "dolby_vision"
version = "3.4.0"
authors = ["quietvoid"]
edition = "2024"
rust-version = "1.88.0"
license = "MIT"
description = "Dolby Vision metadata parsing and writing"
repository = "https://github.com/quietvoid/dovi_tool/tree/main/dolby_vision"

[dependencies]
bitvec_helpers = { version = "4.0.2", default-features = false, features = ["bitstream-io"] }
anyhow = "1.0.103"
bitvec = "1.1.1"
crc = "3.4.0"
roxmltree = { version = "0.21.1", optional = true }
serde = { version = "1.0.228", features = ["derive"], "optional" = true }
serde_json = { version = "1.0.150", features = ["preserve_order"], "optional" = true }
tinyvec = { version = "1.12.0", features = ["rustc_1_55"] }

libc = { version = "0.2", optional = true }

[dev-dependencies]
criterion = "0.8.2"

[features]
xml = ["dep:roxmltree"]
serde = ["dep:serde", "dep:serde_json", "tinyvec/serde"]
capi = ["libc", "serde"]

[package.metadata.docs.rs]
all-features = true

[package.metadata.capi.header]
subdirectory = "libdovi"
name = "rpu_parser"

[package.metadata.capi.pkg_config]
strip_include_path_components = 1
subdirectory = false
name = "dovi"
filename = "dovi"

[package.metadata.capi.library]
rustflags = "-Cpanic=abort"
name = "dovi"

[lib]
doctest = false

[[bench]]
name = "bench_main"
harness = false

[profile.release-deploy]
inherits = "release"
lto = "thin"
strip = "symbols"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(cargo_c)'] }

[lints.clippy]
panic = "deny"
expect_used = "deny"
