[package]
name = "dovi_tool"
version = "2.3.3"
authors = ["quietvoid"]
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
repository = "https://github.com/quietvoid/dovi_tool"
build = "build.rs"

[[bin]]
name = "dovi_tool"
path = "src/main.rs"

[dependencies]
dolby_vision = { path = "dolby_vision", "features" = ["xml", "serde"] }
bitvec_helpers = { version = "4.0.2", default-features = false, features = ["bitstream-io"] }
hevc_parser = { version = "0.6.12", features = ["hevc_io"] }
madvr_parse = "1.0.3"
hdr10plus = { version = "2.1.5", features = ["json"] }

anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive", "wrap_help", "deprecated"] }
clap_lex = "*"
csv = "1.4.0"
indicatif = "0.18.6"
itertools = "0.15.0"
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "all_series"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
thiserror = "2.0.18"

[dev-dependencies]
assert_cmd = "2.2.2"
assert_fs = "1.1.4"
predicates = "3.1.4"

[build-dependencies]
anyhow = "1.0.103"
vergen-gitcl = { version = "10.0.1", default-features = false, features = ["build"] }

[features]
default = ["system-font"]
system-font = ["plotters/ttf"]
internal-font = ["plotters/ab_glyph"]

[profile.release-deploy]
inherits = "release"
lto = "thin"
strip = "symbols"
